name: Free Nodes Aggregator

# 每天跑一次：北京时间 08:00 = UTC 00:00
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_alive_check:
        description: "跳过节点存活检测（更快，但质量差）"
        type: boolean
        default: false

permissions:
  contents: read

# 同一时间只允许一个实例，避免两次运行互相覆盖 Gist
concurrency:
  group: free-nodes-aggregator
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"
  # 配置文件随仓库提交，里面没有密钥，只有 Gist ID 之类的公开信息
  SUBSCRIBE_CONF: subscribe/free-config.json
  # 唯一真正的密钥：GitHub PAT（repo + gist + workflow 权限），存在 Secrets 里
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  # GitHub 爬虫用同一个 PAT 提升 API 配额
  GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  WORKFLOW_MODE: "0"
  ENABLE_SPECIAL_PROTOCOLS: "true"
  SKIP_ALIVE_CHECK: ${{ github.event.inputs.skip_alive_check == 'true' && 'true' || 'false' }}

jobs:
  aggregate:
    name: Crawl & aggregate free nodes
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backup current gist
        run: python .github/scripts/guard.py backup

      - name: Crawl and aggregate
        run: python -u subscribe/process.py -s "$SUBSCRIBE_CONF" --overwrite -n 64 -t 6000
        timeout-minutes: 75

      - name: Normalize clash output
        run: python .github/scripts/guard.py normalize

      - name: Reorder nodes and add proxy groups
        run: python .github/scripts/guard.py postprocess

      - name: Verify generated subscriptions
        run: python .github/scripts/guard.py verify

      - name: Restore previous gist on failure
        if: failure()
        run: python .github/scripts/guard.py restore

      - name: Summary
        if: always()
        run: |
          {
            echo "### 运行结果：${{ job.status }}"
            echo ""
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 提交：${{ github.sha }}"
            echo "- 时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"
